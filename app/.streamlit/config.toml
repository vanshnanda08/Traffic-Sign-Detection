[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 10
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true

[browser]
serverAddress = "127.0.0.1"
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#205d82"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f8"
textColor = "#16324f"
font = "sans serif"
